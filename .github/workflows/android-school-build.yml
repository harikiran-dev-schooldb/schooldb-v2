name: Build school support Android app
run-name: Android app · ${{ inputs.school_slug }} · ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: SchoolDB Android build ID
        required: true
        type: string
      callback_token:
        description: One-time build callback token
        required: true
        type: string
      school_slug:
        description: School URL
        required: true
        type: string
      source_url:
        description: Protected build input URL
        required: true
        type: string
      callback_url:
        description: Protected build callback URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
      CALLBACK_TOKEN: ${{ inputs.callback_token }}
      SOURCE_URL: ${{ inputs.source_url }}
      CALLBACK_URL: ${{ inputs.callback_url }}

    steps:
      - name: Protect callback token
        run: echo "::add-mask::$CALLBACK_TOKEN"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download protected build inputs
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            "${SOURCE_URL}?runId=${GITHUB_RUN_ID}" \
            --output /tmp/android-build-source.json

      - name: Configure school flavor
        run: |
          python3 <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/android-build-source.json").read_text())["data"]
          config = payload["configuration"]
          flavor = config["flavorId"]
          root = Path("school-support-android")
          properties_path = root / "schools.properties"
          lines = properties_path.read_text().splitlines()

          for index, line in enumerate(lines):
              if line.startswith("schools="):
                  schools = [item.strip() for item in line.split("=", 1)[1].split(",") if item.strip()]
                  if flavor not in schools:
                      schools.append(flavor)
                  lines[index] = "schools=" + ",".join(schools)
                  break
          else:
              raise SystemExit("schools.properties does not define schools=")

          values = {
              "applicationId": config["applicationId"],
              "schoolSlug": config["schoolSlug"],
              "schoolName": config["schoolName"],
              "shortName": config["shortName"],
              "location": config["location"],
              "supportLabel": config["supportLabel"],
              "appName": config["appName"],
              "primaryColor": config["primaryColor"],
              "secondaryColor": config["secondaryColor"],
              "accentColor": config["accentColor"],
              "dangerColor": config["dangerColor"],
          }

          for key, value in values.items():
              prefix = f"{flavor}.{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = prefix + value
                      break
              else:
                  lines.append(prefix + value)

          properties_path.write_text("\n".join(lines) + "\n")

          resource_root = root / "app" / "src" / flavor / "res"
          drawable = resource_root / "drawable"
          drawable_nodpi = resource_root / "drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          drawable_nodpi.mkdir(parents=True, exist_ok=True)
          (drawable_nodpi / "school_logo.png").write_bytes(
              base64.b64decode(payload["logoBase64"])
          )
          (drawable / "brand_logo.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/school_logo"
              android:gravity="fill" />
          """)
          (drawable / "brand_launcher_foreground.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:left="24dp" android:top="24dp" android:right="24dp" android:bottom="24dp">
                  <bitmap android:src="@drawable/school_logo" android:gravity="fill" />
              </item>
          </layer-list>
          """)
          (root / "app" / "src" / flavor / "google-services.json").write_bytes(
              base64.b64decode(payload["firebaseBase64"])
          )

          variant = flavor[0].upper() + flavor[1:]
          with Path("/tmp/android-build.env").open("w") as output:
              output.write(f"FLAVOR_ID={flavor}\n")
              output.write(f"VARIANT={variant}\n")
              output.write(f"ARTIFACT_NAME=school-support-{flavor}\n")
          PY

          cat /tmp/android-build.env >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }
          test -n "$CLERK_PUBLISHABLE_KEY" || { echo "CLERK_PUBLISHABLE_KEY is missing"; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'clerkProductionPublishableKey=%s\n' "$CLERK_PUBLISHABLE_KEY"
          } > android/keystore.properties

      - name: Build signed release APK and Play Store bundle
        working-directory: school-support-android
        run: |
          ./gradlew \
            ":app:assemble${VARIANT}Release" \
            ":app:bundle${VARIANT}Release" \
            -PVERSION_CODE="$GITHUB_RUN_NUMBER"

      - name: Stage Android packages
        run: |
          cp \
            "school-support-android/app/build/outputs/apk/$FLAVOR_ID/release/app-$FLAVOR_ID-release.apk" \
            "/tmp/$FLAVOR_ID-school-support.apk"
          cp \
            "school-support-android/app/build/outputs/bundle/${FLAVOR_ID}Release/app-$FLAVOR_ID-release.aab" \
            "/tmp/$FLAVOR_ID-school-support.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-apk
          path: /tmp/${{ env.FLAVOR_ID }}-school-support.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-play
          path: /tmp/${{ env.FLAVOR_ID }}-school-support.aab
          if-no-files-found: error
          retention-days: 30

      - name: Mark build complete
        if: success()
        run: |
          jq -n \
            --arg status "COMPLETED" \
            --arg message "Signed release APK and Play Store AAB are ready." \
            --arg runId "$GITHUB_RUN_ID" \
            '{status: $status, message: $message, runId: $runId}' \
            > /tmp/android-build-callback.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/android-build-callback.json \
            "$CALLBACK_URL"

      - name: Mark build failed
        if: failure()
        run: |
          jq -n \
            --arg status "FAILED" \
            --arg message "The GitHub Actions Android build failed. Open the build logs for details." \
            --arg runId "$GITHUB_RUN_ID" \
            '{status: $status, message: $message, runId: $runId}' \
            > /tmp/android-build-callback.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/android-build-callback.json \
            "$CALLBACK_URL"
