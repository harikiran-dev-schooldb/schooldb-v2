name: Build universal School Support Android app
run-name: Universal Android app · ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: SchoolDB Android build ID
        required: true
        type: string
      callback_token:
        description: One-time build callback token
        required: true
        type: string
      source_url:
        description: Protected build input URL
        required: true
        type: string
      callback_url:
        description: Protected build callback URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
      CALLBACK_TOKEN: ${{ inputs.callback_token }}
      SOURCE_URL: ${{ inputs.source_url }}
      CALLBACK_URL: ${{ inputs.callback_url }}

    steps:
      - name: Protect callback token
        run: echo "::add-mask::$CALLBACK_TOKEN"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download protected build inputs
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            "${SOURCE_URL}?runId=${GITHUB_RUN_ID}" \
            --output /tmp/android-build-source.json

      - name: Configure universal app
        run: |
          python3 <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/android-build-source.json").read_text())["data"]
          root = Path("school-support-android")
          (root / "app" / "google-services.json").write_bytes(
              base64.b64decode(payload["firebaseBase64"])
          )
          with Path("/tmp/android-build.env").open("w") as output:
              output.write("ARTIFACT_NAME=school-support-universal\n")
          PY

          cat /tmp/android-build.env >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }
          test -n "$CLERK_PUBLISHABLE_KEY" || { echo "CLERK_PUBLISHABLE_KEY is missing"; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'clerkProductionPublishableKey=%s\n' "$CLERK_PUBLISHABLE_KEY"
          } > android/keystore.properties

      - name: Build signed release APK and Play Store bundle
        working-directory: school-support-android
        run: |
          ./gradlew \
            ":app:assembleRelease" \
            ":app:bundleRelease" \
            -PVERSION_CODE="$GITHUB_RUN_NUMBER"

      - name: Stage Android packages
        run: |
          cp \
            "school-support-android/app/build/outputs/apk/release/app-release.apk" \
            "/tmp/school-support.apk"
          cp \
            "school-support-android/app/build/outputs/bundle/release/app-release.aab" \
            "/tmp/school-support.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-apk
          path: /tmp/school-support.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-play
          path: /tmp/school-support.aab
          if-no-files-found: error
          retention-days: 30

      - name: Mark build complete
        if: success()
        run: |
          jq -n \
            --arg status "COMPLETED" \
            --arg message "Signed release APK and Play Store AAB are ready." \
            --arg runId "$GITHUB_RUN_ID" \
            '{status: $status, message: $message, runId: $runId}' \
            > /tmp/android-build-callback.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/android-build-callback.json \
            "$CALLBACK_URL"

      - name: Mark build failed
        if: failure()
        run: |
          jq -n \
            --arg status "FAILED" \
            --arg message "The GitHub Actions Android build failed. Open the build logs for details." \
            --arg runId "$GITHUB_RUN_ID" \
            '{status: $status, message: $message, runId: $runId}' \
            > /tmp/android-build-callback.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/android-build-callback.json \
            "$CALLBACK_URL"
