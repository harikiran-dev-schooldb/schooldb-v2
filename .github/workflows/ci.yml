name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schooldb
          POSTGRES_PASSWORD: schooldb
          POSTGRES_DB: schooldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooldb -d schooldb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://schooldb:schooldb@localhost:5432/schooldb
      DIRECT_DATABASE_URL: postgresql://schooldb:schooldb@localhost:5432/schooldb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run db:migrate:deploy
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  public-e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schooldb
          POSTGRES_PASSWORD: schooldb
          POSTGRES_DB: schooldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooldb -d schooldb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://schooldb:schooldb@localhost:5432/schooldb
      DIRECT_DATABASE_URL: postgresql://schooldb:schooldb@localhost:5432/schooldb
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_SKIP_AUTH_REFRESH: "true"
      E2E_PRODUCTION_SERVER: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:public

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [android, school-support-android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Test, lint, and build debug and release variants
        working-directory: ${{ matrix.project }}
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [android, school-support-android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run Android UI smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd ${{ matrix.project }} && ./gradlew connectedDebugAndroidTest --no-daemon

  authenticated-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_SCHOOL_SLUG: ${{ vars.E2E_SCHOOL_SLUG }}
      E2E_AUTH_STATE_BASE64: ${{ secrets.E2E_AUTH_STATE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Validate staging test configuration
        run: test -n "$E2E_BASE_URL" && test -n "$E2E_SCHOOL_SLUG" && test -n "$E2E_AUTH_STATE_BASE64"
      - name: Restore dedicated test account session
        run: |
          mkdir -p playwright/.auth
          printf '%s' "$E2E_AUTH_STATE_BASE64" | base64 --decode > playwright/.auth/admin.json
      - name: Run authenticated desktop and mobile workflows
        env:
          E2E_AUTH_STATE: playwright/.auth/admin.json
        run: npm run test:e2e -- --project=authenticated-admin --project=authenticated-iphone-16
