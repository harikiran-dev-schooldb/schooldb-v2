name: School Support Release Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'school-support-android/.version-code'

permissions:
  contents: read

concurrency:
  group: support-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      # Release shrinking plus simultaneous APK/AAB packaging can exhaust the
      # default 2 GB Gradle heap on a hosted runner. Keep packaging sequential
      # and give bundletool enough headroom without changing developer builds.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.SUPPORT_ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$SUPPORT_ANDROID_GOOGLE_SERVICES_BASE64"

      - name: Configure signing and Firebase
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPORT_ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.SUPPORT_ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf '%s\n' \
            'storeFile=release.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "clerkProductionPublishableKey=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            > android/keystore.properties
          printf '%s' "$SUPPORT_ANDROID_GOOGLE_SERVICES_BASE64" | base64 --decode > school-support-android/app/google-services.json

      - name: Build signed School Support APK and AAB
        working-directory: school-support-android
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --no-daemon --no-parallel --max-workers=2

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: school-support-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            school-support-android/app/build/outputs/apk/release/*.apk
            school-support-android/app/build/outputs/bundle/release/*.aab

